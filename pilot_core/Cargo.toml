[package]
name = "pilot_core"
version = "0.1.0"
edition = "2024"
description = "Rust core of the residual-RL racing pilot: ST plant (linear / Pacejka / Fiala tires), gymkhana step semantics, track-limit geometry and the per-physics-step lap loop"
license = "MIT"
publish = false

[lib]
name = "pilot_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
numpy = "0.30.0"
osqp-sys = "1.0.1"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }  # extension-module: enabled by maturin (pyproject.toml)
robust = "1.2"

[profile.release]
codegen-units = 1
lto = "fat"
